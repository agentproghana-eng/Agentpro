<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <meta
    name="robots"
    content="noindex"
  >
  <title>Page Not Found | Intellicore System</title>
  <link
    rel="icon"
    href="/favicon.svg"
    type="image/svg+xml"
  >
  <link
    rel="stylesheet"
    href="/styles.css"
  >
</head>
<body>
  <main class="error-page">
    <section class="shell error-card">
      <p class="eyebrow">
        Intellicore System
      </p>

      <h1>404</h1>

      <h2>
        This page could not be found.
      </h2>

      <p>
        The address may have changed or the page may no
        longer exist.
      </p>

      <a
        class="button button-primary"
        href="/"
      >
        Return home
      </a>
    </section>
  </main>
</body>
</html>
