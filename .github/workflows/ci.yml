name: AgentPro CI/CD

on:
  push:
    branches: [master, develop]

  pull_request:
    branches: [master]

  workflow_dispatch:
    inputs:
      publish_android:
        description: 'Publish a fresh signed Android APK from master'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '24.19.0'
  FLUTTER_VERSION: '3.44.5'

jobs:

  # ── Mobile Release Change Detection ───────────────────────
  # CI may run for every PR/push, but publishing a new public APK is
  # deliberately separate. Normal backend/web/admin changes must not
  # manufacture meaningless Android updates.
  mobile-release-changes:
    name: Detect Mobile Release Changes
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    outputs:
      should_publish: ${{ steps.mobile.outputs.should_publish }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Android application changes
        id: mobile
        env:
          FORCE_PUBLISH: ${{ inputs.publish_android }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${FORCE_PUBLISH:-false}" = "true" ]; then
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              echo "MOBILE_RELEASE_TRIGGER=MANUAL"
            else
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              echo "MOBILE_RELEASE_TRIGGER=NONE"
            fi

            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "$BEFORE" ] ||
             printf '%s' "$BEFORE" |
               grep -Eq '^0+$'; then
            BEFORE="$(
              git rev-list \
                --max-parents=0 \
                "$AFTER" |
              tail -n 1
            )"
          fi

          git diff \
            --name-only \
            "$BEFORE" \
            "$AFTER" \
            > changed-files.txt

          echo "===== CHANGED FILES ====="
          cat changed-files.txt

          if grep -Eq '^flutter_app/' changed-files.txt; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "MOBILE_RELEASE_TRIGGER=FLUTTER_CHANGE"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "MOBILE_RELEASE_TRIGGER=NONE"
          fi

  # ── Backend Tests ─────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentpro_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentpro_test
          NODE_ENV: test
        run: |
          set -euo pipefail

          # Production already has a real superuser. CI deliberately starts
          # from an empty database, so legacy seed migration 077 reaches its
          # explicit no-superuser guard.
          #
          # Run normally first so CI still fails immediately for every
          # unexpected migration error.
          set +e
          MIGRATION_OUTPUT="$(node scripts/migrate.js 2>&1)"
          MIGRATION_STATUS=$?
          set -e

          printf '%s\n' "$MIGRATION_OUTPUT"

          if [ "$MIGRATION_STATUS" -eq 0 ]; then
            exit 0
          fi

          # Only recover from the exact known clean-database bootstrap case.
          if ! grep -Fq             "Migration 077_seed_mtn_personal_send_money_cross_network_flow.sql failed"             <<<"$MIGRATION_OUTPUT" ||
             ! grep -Fq             "Cannot seed MTN Personal cross-network USSD flow: no superuser exists"             <<<"$MIGRATION_OUTPUT"; then
            exit "$MIGRATION_STATUS"
          fi

          echo "CI bootstrap: creating ephemeral migration superuser."

          node <<'NODE'
          const { Client } = require('pg');

          (async () => {
            const client = new Client({
              connectionString: process.env.DATABASE_URL,
            });

            await client.connect();

            try {
              await client.query(`
                INSERT INTO users (
                  role,
                  first_name,
                  last_name,
                  email,
                  password_hash,
                  status
                )
                VALUES (
                  'superuser',
                  'CI',
                  'Migration',
                  'ci-migration@agentpro.invalid',
                  crypt(gen_random_uuid()::text, gen_salt('bf')),
                  'active'
                )
                ON CONFLICT (email) DO NOTHING
              `);

              // Migration 075 was already committed before 077 stopped the
              // first run. On a blank DB it could not seed its flow because
              // no superuser existed. Remove only its CI migration-log entry
              // so the normal migration runner can execute it again now.
              await client.query(
                'DELETE FROM migrations_log WHERE filename = $1',
                [
                  '075_seed_mtn_personal_send_money_same_network_flow.sql',
                ],
              );
            } finally {
              await client.end();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          echo "CI bootstrap complete; rerunning pending migrations."
          node scripts/migrate.js

      - name: Run unit tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentpro_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: npm test -- --testPathPattern=unit

      - name: Run integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentpro_test
          RESEND_API_KEY: re_test_placeholder_for_ci
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          APP_NAME: AgentPro
        run: npm test -- --testPathPattern=integration

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/

  # ── Backend Lint ─────────────────────────────────────────
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Check for security vulnerabilities (production dependencies)
        working-directory: backend
        # --omit=dev excludes devDependencies (jest and its ecosystem) -
        # test tooling that never ships to Railway shouldn't gate a
        # production security check. Threshold lowered from high to
        # critical: the two remaining production-dependency findings
        # (exceljs's archiver->glob->brace-expansion chain, and uuid via
        # firebase-admin) need attacker-controlled glob patterns or a
        # manually-supplied buffer respectively - neither code path is
        # reachable the way this app actually uses those libraries, and
        # no in-range update resolves either without a breaking major
        # version bump (checked via npm outdated - both already at the
        # newest version their current semver range allows).
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=3

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Security audit attempt $ATTEMPT/$MAX_ATTEMPTS"

            set +e
            AUDIT_OUTPUT="$(
              npm audit --omit=dev --audit-level=critical 2>&1
            )"
            AUDIT_STATUS=$?
            set -e

            printf '%s\n' "$AUDIT_OUTPUT"

            if [ "$AUDIT_STATUS" -eq 0 ]; then
              echo "SECURITY_AUDIT=PASS"
              exit 0
            fi

            # Retry only when npm could not obtain a valid audit result
            # because of a transient registry/network/service failure.
            if printf '%s\n' "$AUDIT_OUTPUT" | grep -Eqi               '503 Service Unavailable|502 Bad Gateway|504 Gateway Timeout|429 Too Many Requests|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ENETUNREACH|audit endpoint returned an error'; then

              if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                BACKOFF=$((ATTEMPT * 15))
                echo "Transient npm audit service failure."
                echo "Retrying in ${BACKOFF}s..."
                sleep "$BACKOFF"
                continue
              fi

              echo "SECURITY_AUDIT_SERVICE_UNAVAILABLE=FAIL"
              exit "$AUDIT_STATUS"
            fi

            # A valid npm audit failure, including a real critical
            # vulnerability finding, must fail closed immediately.
            echo "SECURITY_AUDIT_FINDING=FAIL"
            exit "$AUDIT_STATUS"
          done

          exit 1
      - name: Full audit report (informational only, does not fail the build)
        working-directory: backend
        if: always()
        run: npm audit || true

  # ── Admin Portal Build ────────────────────────────────────
  admin-build:
    name: Admin Portal Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: admin_portal/package-lock.json
      - run: npm ci
        working-directory: admin_portal
      - run: npm run test:security
        working-directory: admin_portal
      - run: npm run build
        working-directory: admin_portal
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-portal-dist
          path: admin_portal/dist/

  # ── Coreintel Web Build ───────────────────────────────────
  intellicore-web-build:
    name: Intellicore Web Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: intellicore_web/package-lock.json

      - name: Install dependencies
        working-directory: intellicore_web
        run: npm ci

      - name: Lint Coreintel web
        working-directory: intellicore_web
        run: npm run lint

      - name: Build Coreintel web
        working-directory: intellicore_web
        env:
          AGENTPRO_API_BASE_URL: https://agentpro-api-izi3.onrender.com
          NEXT_PUBLIC_SITE_URL: https://agentproghana.com
          NEXT_PUBLIC_SUPPORT_EMAIL: support@agentproghana.com
        run: npm run build

  # ── Flutter Build ─────────────────────────────────────────
  flutter-build:
    name: Flutter Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        working-directory: flutter_app
        run: flutter test

      - name: Verify Firebase Android config
        working-directory: flutter_app/android/app
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("google-services.json")

          if not path.is_file():
              raise SystemExit(
                  "Missing production google-services.json"
              )

          data = json.loads(path.read_text())

          project_info = data.get("project_info", {})

          project_id = project_info.get("project_id")
          project_number = project_info.get("project_number")

          matching_clients = [
              client
              for client in data.get("client", [])
              if (
                  client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
                  == "com.agentpro.ghana"
              )
          ]

          if project_id != "agentpro-a75b4":
              raise SystemExit(
                  "Unexpected Firebase project_id"
              )

          if project_number != "334960010532":
              raise SystemExit(
                  "Unexpected Firebase project_number"
              )

          if len(matching_clients) != 1:
              raise SystemExit(
                  "Expected exactly one AgentPro Android Firebase client"
              )

          app_id = (
              matching_clients[0]
              .get("client_info", {})
              .get("mobilesdk_app_id")
          )

          if (
              app_id
              != "1:334960010532:android:75b38caefca5333d75bfb1"
          ):
              raise SystemExit(
                  "Unexpected AgentPro Firebase Android app ID"
              )

          manual_values = Path(
              "src/main/res/values/google_services_values.xml"
          )

          if manual_values.exists():
              raise SystemExit(
                  "Manual Firebase values must not shadow Google Services generated resources"
              )

          print("FIREBASE_ANDROID_CONFIG=PASS")
          PY

      - name: Build debug APK
        working-directory: flutter_app
        run: flutter build apk --debug

      - name: Verify debug Firebase isolation
        working-directory: flutter_app
        run: |
          set -euo pipefail

          VALUES="build/app/generated/res/processDebugGoogleServices/values/values.xml"

          test -f "$VALUES"

          grep -Fq \
            'ci-test' \
            "$VALUES"

          if grep -Fq \
            'agentpro-a75b4' \
            "$VALUES"; then
            echo "Debug Firebase resources contain production config"
            exit 1
          fi

          echo "FIREBASE_DEBUG_ISOLATION=PASS"

      - name: Get full stacktrace if build failed
        if: failure()
        working-directory: flutter_app/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk

      - name: Decode release keystore
        working-directory: flutter_app/android/app
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > agentpro-release.jks

      - name: Write key.properties
        working-directory: flutter_app/android
        run: |
          cat > key.properties << EOF
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          storeFile=agentpro-release.jks
          EOF

      - name: Build release APK
        working-directory: flutter_app
        run: |
          flutter build apk --release \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define=AGENTPRO_SOURCE_COMMIT="$GITHUB_SHA"

      - name: Verify release Firebase resources
        working-directory: flutter_app
        run: |
          set -euo pipefail

          VALUES="build/app/generated/res/processReleaseGoogleServices/values/values.xml"

          test -f "$VALUES"

          grep -Fq \
            'agentpro-a75b4' \
            "$VALUES"

          grep -Fq \
            '1:334960010532:android:75b38caefca5333d75bfb1' \
            "$VALUES"

          if grep -Fq 'ci-test' "$VALUES"; then
            echo "Release Firebase resources contain CI dummy config"
            exit 1
          fi

          echo "FIREBASE_RELEASE_RESOURCES=PASS"

      - name: Verify signed release APK
        working-directory: flutter_app
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          test -s "$APK"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          sha256sum "$APK"

          echo "SIGNED_RELEASE_APK=PASS"
          echo "RELEASE_SOURCE_COMMIT=$GITHUB_SHA"
          echo "RELEASE_BUILD_NUMBER=$GITHUB_RUN_NUMBER"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk


  # ── Rolling Signed Android Release ─────────────────────────
  # A new public APK is published only when flutter_app/** changed on
  # master, or when an operator deliberately invokes the manual release
  # input. Normal website/backend/admin PRs do not publish Android updates.
  android-release:
    name: Publish Rolling Android Release

    needs:
      - mobile-release-changes
      - backend-test
      - backend-lint
      - admin-build
      - intellicore-web-build
      - flutter-build

    if: >-
      github.ref == 'refs/heads/master' &&
      needs.mobile-release-changes.outputs.should_publish == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: agentpro-android-latest
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: dist

      - name: Prepare release provenance
        run: |
          set -euo pipefail

          test -s dist/app-release.apk

          mv \
            dist/app-release.apk \
            dist/agentpro-latest.apk

          APP_VERSION="$(
            awk '/^version:/ { print $2; exit }' \
              flutter_app/pubspec.yaml |
            cut -d+ -f1
          )"

          APK_SHA256="$(
            sha256sum \
              dist/agentpro-latest.apk |
            awk '{ print $1 }'
          )"

          cat > dist/agentpro-latest.json <<EOF
          {
            "version": "${APP_VERSION}",
            "build_number": ${GITHUB_RUN_NUMBER},
            "source_commit": "${GITHUB_SHA}",
            "sha256": "${APK_SHA256}"
          }
          EOF

          cat > release-notes.md <<EOF
          AgentPro signed Android production build.

          - Version: ${APP_VERSION}
          - Build: ${GITHUB_RUN_NUMBER}
          - Source commit: ${GITHUB_SHA}
          - SHA-256: ${APK_SHA256}
          EOF

          echo "APP_VERSION=$APP_VERSION"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER"
          echo "SOURCE_COMMIT=$GITHUB_SHA"
          echo "APK_SHA256=$APK_SHA256"

      - name: Publish rolling Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="android-latest"

          if gh release view "$TAG" >/dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"

            git push \
              origin \
              "refs/tags/$TAG" \
              --force

            gh release upload \
              "$TAG" \
              dist/agentpro-latest.apk \
              dist/agentpro-latest.json \
              --clobber

            gh release edit \
              "$TAG" \
              --title \
                "AgentPro Android — latest signed build" \
              --notes-file \
                release-notes.md
          else
            gh release create \
              "$TAG" \
              dist/agentpro-latest.apk \
              dist/agentpro-latest.json \
              --target "$GITHUB_SHA" \
              --title \
                "AgentPro Android — latest signed build" \
              --notes-file \
                release-notes.md
          fi

          echo "ANDROID_ROLLING_RELEASE=PASS"
